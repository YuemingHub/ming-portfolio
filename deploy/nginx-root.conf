# YUE MING ECOSYSTEM 作品集 · ymai.me 根路径（2026-11-03）
# 这是 /etc/nginx/snippets/ming-portfolio-ymai-me.conf 的内容，由 ymai.me
# server 块 include；include 后由本文件提供 location / 与 /gui/。
# 不覆盖 /api/、/health、/api/wechat；Self Space 保留在构建原生路径 /gui/。

location = /ming {
    absolute_redirect off;
    return 301 /;
}

location ^~ /ming/ {
    absolute_redirect off;
    rewrite ^/ming/?(.*)$ /$1 permanent;
}

# Self Space：Next.js 静态导出，basePath=/gui
location = /gui {
    absolute_redirect off;
    return 301 /gui/;
}

location ^~ /gui/ {
    root /opt/self-space/current;
    index index.html;
    try_files $uri $uri/ =404;
}

# 作品集静态资源缺失时必须 404，不能回退成 SPA HTML
location ^~ /assets/ {
    root /opt/ming-portfolio/current/ming;
    try_files $uri =404;
}

location ^~ /media/ {
    root /opt/ming-portfolio/current/ming;
    try_files $uri =404;
}

location = /favicon.svg {
    root /opt/ming-portfolio/current/ming;
    try_files $uri =404;
}

location = /og-card.png {
    root /opt/ming-portfolio/current/ming;
    try_files $uri =404;
}

location / {
    root /opt/ming-portfolio/current/ming;
    index index.html;
    absolute_redirect off;
    rewrite ^/(ecosystem|spaces|institution|expert-and-research|agent-space|evidence|cooperation)/$ /$1 permanent;
    try_files $uri $uri/ /index.html;
}
